login:
    path: /login.php
    controller: App\Controller\LoginController
    methods: [GET, POST]

logout:
    path: /logout.php
    controller: App\Controller\LogoutController
    methods: [GET, POST]

# Runtime and authorization probes only exist in the test environment.
when@test:
    runtime_smoke:
        path: /runtime-smoke
        controller: Symfony\Bundle\FrameworkBundle\Controller\TemplateController
        defaults: { template: base.html.twig }
        methods: [GET]

    security_probe:
        path: /_test/security/{caseId}
        controller: App\Tests\Functional\Security\AuthorizationProbeController
        methods: [GET, POST]

